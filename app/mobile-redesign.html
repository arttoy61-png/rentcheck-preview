<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rent Check | 새 탐색 화면</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif;color:#132b49;background:#f5f7fa}button,select{font:inherit;cursor:pointer}button{border:0}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 25px;background:white;border-bottom:1px solid #e1e6ed}.brand{font-size:23px;font-weight:850;letter-spacing:-.5px}.brand b{display:inline-block;background:#c8a342;color:#fff;border-radius:6px;padding:6px;margin-right:10px;font-size:18px}.nav{display:flex;gap:26px;font-size:13px;font-weight:700}.wrap{max-width:1600px;margin:auto;padding:18px 22px}.tabs{display:flex;background:white;border:1px solid #e0e6ed;border-radius:10px;overflow:hidden;margin-bottom:14px}.tabs button{flex:1;background:white;padding:15px 6px;font-weight:750;color:#65758b}.tabs button.active{background:#102e52;color:#fff;border-bottom:3px solid #cba43e}.workspace{height:calc(100dvh - 168px);display:grid;grid-template-columns:400px minmax(0,1fr);gap:14px}.pane,.map{background:#fff;border:1px solid #e1e7ef;border-radius:13px;min-height:0;overflow:hidden}.pane{display:flex;flex-direction:column}.panehead{padding:19px;border-bottom:1px solid #edf0f4}.panehead h1{margin:0 0 6px;font-size:22px}.sub{font-size:12px;color:#718097}.tools{display:flex;gap:8px;margin-top:15px}.tools select{width:100%;min-width:0;padding:10px;border:1px solid #d9e2eb;border-radius:9px;background:#fff;color:#173d66}.cards{flex:1;min-height:0;overflow:auto;padding:10px 14px}.card{display:flex;align-items:center;gap:13px;width:100%;padding:14px;margin:0 0 10px;border:1px solid #e0e7ef;border-radius:11px;background:#fff;text-align:left;color:#15304e}.card:hover,.card:focus{border-color:#c6a044;background:#fffcf3}.thumb{width:68px;height:72px;flex:0 0 68px;display:grid;place-items:center;border-radius:8px;background:#e9f0f6;color:#1b578a;font-size:25px}.card strong{display:block;font-size:15px;line-height:1.35}.card small{display:block;margin-top:6px;color:#6b7e93;font-size:12px}.pill{display:inline-block;background:#f4e9c9;color:#70541a;font-size:11px;font-weight:750;border-radius:5px;padding:3px 7px;margin-top:6px}.map{position:relative}#kakao{height:100%;width:100%;background:#e6edf1}.mapnote{position:absolute;top:15px;left:15px;z-index:2;background:white;padding:10px 14px;border-radius:20px;box-shadow:0 2px 12px #183b5a25;font-size:12px;font-weight:750}.next{display:none}.detail{background:#fff;padding:20px;overflow:auto;height:100%}.detail h1{font-size:25px;margin:14px 0}.back{background:transparent;color:#1359a5;font-weight:750;padding:8px 0}.list-toolbar{display:none}.map-nav{background:#eff6ff;color:#1256a1;border:1px solid #cfe1f7;border-radius:9px;min-height:42px;padding:9px 14px;font-size:15px;font-weight:800}.map-coverage{font-size:12px;color:#637a94;line-height:1.4;text-align:right}.detail-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}.detail-actions button{font-size:15px;min-height:48px}.section{border:1px solid #e3eaf2;border-radius:11px;padding:15px;margin:13px 0}.section h3{margin:0 0 12px;font-size:16px}.section p{font-size:14px;line-height:1.7;color:#465b72}.action{display:block;background:#112f52;color:white;padding:15px;width:100%;border-radius:10px;font-weight:750;margin:12px 0}.secondary{background:#f3f7fc;color:#174c85}.empty{padding:22px;color:#65778c}.hidden{display:none!important}
@media(max-width:700px){.list-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 16px}.map-nav{flex-shrink:0}.map-coverage{font-size:12px}.panehead{padding-top:15px}header{height:60px;padding:0 16px}.brand{font-size:20px}.nav{display:none}.wrap{padding:0}.tabs{margin:0;border-radius:0;border-left:0;border-right:0}.tabs button{padding:13px 3px;font-size:12px}.workspace{height:calc(100dvh - 112px);display:block}.pane,.map{border:0;border-radius:0;height:100%}.panehead{padding:16px}.cards{padding:10px 14px}.next{display:block;position:absolute;bottom:18px;left:16px;right:16px;z-index:3;background:white;border:1px solid #d4e1ef;border-radius:13px;padding:17px;text-align:left;font-weight:800;color:#183d65;box-shadow:0 5px 18px #14395b27}.detail{padding:17px;height:100%}.detail h1{font-size:24px}}
</style></head><body><header><div class="brand"><b>Rc</b>Rent Check</div><nav class="nav">홈　 실거래　 계산 도구　 공고　 분석 글</nav><span>⌕</span></header><div class="wrap"><div class="tabs" id="tabs"></div><div class="workspace"><section class="pane" id="pane"><div class="panehead"><div id="listToolbar" class="list-toolbar"><button type="button" class="map-nav" id="listToMap">← 지도 보기</button><span class="map-coverage" id="mapAvailableCount"></span></div><h1 id="title"></h1><div class="sub" id="summary"></div><div class="tools"><select id="district" aria-label="지역"></select><select id="status" aria-label="진행상태"></select></div></div><div class="cards" id="cards"></div></section><section class="map" id="map"><div id="kakao"></div><div class="mapnote" id="mapnote">공식 위치 확인 현장만 표시</div><button type="button" class="map-nav" id="mapToListBack" style="display:none;position:absolute;left:14px;top:65px;z-index:4;background:white">← 목록으로</button><button class="next" id="next">현장 목록 보기　→</button></section><section class="detail hidden" id="detail"><button class="back" id="back">← 이전 화면</button><div id="detailBody"></div></section></div></div><script src="config.public.js"></script><script>
const TOPICS=[['redevelopment','재개발'],['housing','공공주택'],['sale','분양'],['auction','경매']],mobile=()=>matchMedia('(max-width:700px)').matches;let topic='redevelopment',view='map',district='강서구',status='all',selected=null,items=[],points={},map=null,markers=[],previous='list',loaded=false;
const el=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=async p=>{const r=await fetch(p);if(!r.ok)throw Error(p+' '+r.status);return r.json()};
let projects=[],moa=[],housing=[],sales=[];
function startView(t){return mobile()&&['housing','sale','auction'].includes(t)?'list':'map'}
async function load(){try{const [a,b,c,d,e]=await Promise.all([read('data/seoul-projects.json'),read('data/moa-projects.json'),read('data/public-notices.json'),read('data/sales-notices.json'),read('data/redevelopment-map-points.json')]);projects=a;moa=b.records||[];housing=c.records||c.notices||[];sales=d.records||[];points=e.points||{};loaded=true;draw()}catch(e){el('summary').textContent='자료 연결 실패: '+e.message}}
function data(){if(topic==='redevelopment')return [...projects,...moa].map(p=>({...p,name:p.title||p.project_name,mapPoint:points[p.id]}));if(topic==='housing')return housing.map(p=>({...p,name:p.title,district:(p.districts||[])[0]||'지역 미확인',status:p.application_status||p.status||'공고'}));if(topic==='sale')return sales.map(p=>({...p,name:p.title}));return []}
function filtered(){return data().filter(p=>(district==='all'||p.district===district||(topic==='housing'&&(!p.districts?.length||p.districts.includes(district))))&&(status==='all'||p.status===status))}
function go(v,p){previous=view;view=v;if(p)selected=p;history.pushState({topic,view,district,status,selected,previous},'', '#new/'+topic+'/'+view+(v==='detail'&&selected?'/'+encodeURIComponent(selected.id):''));draw()}
function changeTopic(t){topic=t;district=['housing','sale'].includes(t)?'all':'강서구';status='all';selected=null;view=startView(t);go(view)}
const defaultCamera=()=>({lat:37.5478,lng:126.8486,level:mobile()?5:6});let cameraRegion=null;function focusRegion(){if(!map)return;const d=defaultCamera();if(district==='강서구'){map.setCenter(new kakao.maps.LatLng(d.lat,d.lng));map.setLevel(d.level);}else{const locations=filtered().filter(p=>p.mapPoint).map(p=>p.mapPoint);if(locations.length){const bounds=new kakao.maps.LatLngBounds();locations.forEach(([lat,lng])=>bounds.extend(new kakao.maps.LatLng(lat,lng)));map.setBounds(bounds);if(map.getLevel()<4)map.setLevel(4);}else if(district==='all'){map.setCenter(new kakao.maps.LatLng(37.555,126.978));map.setLevel(8);}}cameraRegion=district;}function mapInit(){if(map||!window.kakao?.maps)return;const d=defaultCamera();map=new kakao.maps.Map(el('kakao'),{center:new kakao.maps.LatLng(d.lat,d.lng),level:d.level});cameraRegion=district;drawMap()}
function drawMap(){if(!map)return;markers.forEach(m=>m.setMap(null));markers=[];if(topic!=='redevelopment'){el('mapnote').textContent='이 분야는 공고 목록을 먼저 확인하세요';return}const list=filtered().filter(p=>p.mapPoint).slice(0,350);for(const p of list){const m=new kakao.maps.Marker({map,position:new kakao.maps.LatLng(p.mapPoint[0],p.mapPoint[1]),title:p.name});kakao.maps.event.addListener(m,'click',()=>go('detail',p));markers.push(m)}el('mapnote').textContent='공식 경계 위치 '+list.length+'건 · 목록 '+filtered().length+'건';setTimeout(()=>{map.relayout();if(cameraRegion!==district)focusRegion();},70)}
function initKakao(){const key=window.RENTCHECK_MAP_CONFIG?.kakaoJavaScriptKey;if(!key){el('mapnote').textContent='지도 설정 확인 필요';return}const script=document.createElement('script');script.src='https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&appkey='+encodeURIComponent(key);script.onload=()=>kakao.maps.load(mapInit);script.onerror=()=>el('mapnote').textContent='카카오 지도 연결 실패';document.head.appendChild(script)}
function draw(){const arr=filtered();const mapCount=topic==='redevelopment'?arr.filter(p=>p.mapPoint).length:0;el('listToolbar').hidden=topic!=='redevelopment';el('mapAvailableCount').textContent=mapCount?'공식 지도 '+mapCount+'건':'공식 지도 위치 미확인';el('mapToListBack').style.display=mobile()&&view==='map'&&previous==='list'?'block':'none';el('tabs').innerHTML=TOPICS.map(([k,n])=>'<button class="'+(topic===k?'active':'')+'" data-topic="'+k+'">'+n+'</button>').join('');el('title').textContent=TOPICS.find(x=>x[0]===topic)[1]+' '+(topic==='redevelopment'?'현장':'공고');el('summary').textContent=loaded?arr.length+'건 · 공식자료 기반 · 지도 위치는 별도 확인':'공식자료 불러오는 중';const districts=['all',...new Set(data().map(x=>x.district).filter(Boolean))].sort((a,b)=>a==='all'?-1:b==='all'?1:a.localeCompare(b,'ko'));el('district').innerHTML=districts.map(d=>'<option value="'+escape(d)+'" '+(district===d?'selected':'')+'>'+ (d==='all'?'서울 전체':escape(d))+'</option>').join('');el('status').innerHTML=['all',...new Set(data().map(x=>x.status).filter(Boolean))].map(x=>'<option value="'+escape(x)+'" '+(status===x?'selected':'')+'>'+(x==='all'?'전체 진행상태':escape(x))+'</option>').join('');el('cards').innerHTML=arr.length?arr.slice(0,250).map((p,i)=>'<button class="card" data-index="'+i+'"><span class="thumb">'+(p.mapPoint?'⌖':'▤')+'</span><span><strong>'+escape(p.name)+'</strong><span class="pill">'+escape(p.status||'상태 확인')+'</span><small>'+escape(p.district||'서울')+(p.mapPoint?' · 공식경계 지도':' · 목록 자료')+'</small></span></button>').join(''):'<div class="empty">해당 조건의 확인된 자료가 없습니다.</div>';el('pane').classList.toggle('hidden',mobile()&&view!=='list');el('map').classList.toggle('hidden',mobile()&&view!=='map');el('detail').classList.toggle('hidden',view!=='detail');el('back').textContent=previous==='map'?'← 지도로 돌아가기':'← 현장 목록으로';el('next').textContent=topic==='redevelopment'?'재개발 현장 목록 보기　→':'공고 목록 보기　→';if(view==='detail'&&selected){const p=selected;el('detailBody').innerHTML='<div class="sub">Rent Check · 공식자료 상세</div><h1>'+escape(p.name)+'</h1><div class="pill">'+escape(p.status||'상태 미확인')+'</div><div class="section"><h3>사업·공고 개요</h3><p>지역: '+escape(p.district||'미확인')+'</p><p>주소: '+escape(p.address||'확인된 주소 없음')+'</p><p>공고일: '+escape(p.published_at||p.published||'미확인')+'</p></div><div class="section"><h3>자료 확인</h3><p>지도 표시는 공식 경계가 검증된 항목에만 제공됩니다.</p></div>'+(p.source_url?'<a class="action secondary" href="'+encodeURI(p.source_url)+'" target="_blank" rel="noopener">공식 출처 보기</a>':'')+(p.mapPoint?'<div class="detail-actions"><button class="action" id="goMap">이 현장 지도 보기</button></div>':'');}if(view==='map'&&map)setTimeout(drawMap,60)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-topic]');if(t){changeTopic(t.dataset.topic);return}const card=e.target.closest('[data-index]');if(card){go('detail',filtered()[Number(card.dataset.index)]);return}if(e.target.closest('#next')){go('list');return}if(e.target.closest('#listToMap')){go('map');return}if(e.target.closest('#mapToListBack')){go('list');return}if(e.target.closest('#back')){history.back();return}if(e.target.closest('#goMap')){const point=selected?.mapPoint;go('map');if(point&&map)setTimeout(()=>{map.relayout();map.setCenter(new kakao.maps.LatLng(point[0],point[1]));map.setLevel(Math.min(map.getLevel(),5))},160);return}});
el('district').addEventListener('change',e=>{district=e.target.value;draw()});el('status').addEventListener('change',e=>{status=e.target.value;draw()});
window.addEventListener('popstate',e=>{if(e.state){({topic,view,district,status,selected,previous}=e.state);draw()}else{view=startView(topic);draw()}});
window.addEventListener('resize',()=>{if(!mobile()&&view!=='detail')view='map';draw()});draw();load();initKakao();
</script></body></html>
