<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rent Check · 리뉴얼 검토</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif;color:#102744;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}header{height:66px;background:#fff;border-bottom:1px solid #e6ebf2;display:flex;align-items:center;justify-content:space-between;padding:0 26px}.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}.mark{background:#cba43e;color:#fff;padding:8px;border-radius:7px;font-weight:700}.toplinks{display:flex;gap:25px;font-size:14px;font-weight:700}main{max-width:1540px;margin:auto;padding:20px 24px}.tabs{display:flex;background:#fff;border:1px solid #e2e8f1;border-radius:10px;overflow:hidden;margin-bottom:16px}.tabs button{flex:1;border:0;background:#fff;padding:17px 8px;font-weight:700;color:#59697d}.tabs button.active{background:#102e50;color:#fff;border-bottom:3px solid #cba43e}.workspace{display:grid;grid-template-columns:390px 1fr;gap:16px;height:calc(100dvh - 170px)}.panel,.map{background:#fff;border:1px solid #e1e8f0;border-radius:13px;overflow:hidden}.panel{display:flex;flex-direction:column}.panelhead{padding:20px 20px 14px}.panelhead h2{margin:0 0 8px;font-size:22px}.muted{font-size:13px;color:#6a7c91}.filters{display:flex;gap:7px;margin-top:14px}.filters button{background:#fff;border:1px solid #d9e1ea;border-radius:8px;padding:10px;font-size:13px}.cards{padding:0 14px 20px;overflow:auto}.card{display:flex;gap:12px;width:100%;padding:13px;text-align:left;background:#fff;border:1px solid #e2e8ef;border-radius:11px;margin:10px 0}.card:hover{border-color:#cba43e}.photo{width:78px;height:80px;flex:none;border-radius:8px;background:linear-gradient(145deg,#9eb7ce,#e7eff4);display:grid;place-items:center;color:#315371;font-size:24px}.card strong{display:block;margin:2px 0 7px}.tag{display:inline-block;background:#f5e9c7;color:#715313;font-size:11px;font-weight:700;padding:4px 7px;border-radius:6px}.map{position:relative;background:#e7eff0}.mapbg{position:absolute;inset:0;background:linear-gradient(25deg,transparent 42%,#c3d9e8 43%,#c3d9e8 47%,transparent 48%),repeating-linear-gradient(110deg,transparent 0 63px,#fff 64px 70px,transparent 71px 120px),repeating-linear-gradient(18deg,#eaf1eb 0 48px,#fff 49px 55px,#e9f0e7 56px 100px)}.mapnote{position:absolute;top:18px;left:18px;background:#fff;padding:12px 15px;border-radius:24px;font-size:13px;font-weight:700;box-shadow:0 2px 12px #24405b18}.pin{position:absolute;border:3px solid #fff;border-radius:12px;background:#0c3764;color:white;padding:10px 14px;font-weight:700;box-shadow:0 3px 10px #203f5c2b}.pin:nth-of-type(2){top:34%;left:30%}.pin:nth-of-type(3){top:58%;left:58%}.pin:nth-of-type(4){top:24%;left:70%}.detail{background:#fff;height:100%;padding:22px;overflow:auto}.detail h1{font-size:25px}.back{border:0;background:none;color:#1358a0;font-weight:750;padding:10px 0}.timeline{display:flex;justify-content:space-between;gap:6px;margin:30px 0}.step{flex:1;border-top:5px solid #dfe5ed;padding-top:12px;text-align:center;font-size:12px;color:#667}.step.done{border-color:#caa23e;color:#153b68;font-weight:700}.section{border:1px solid #e3e9f0;border-radius:11px;padding:17px;margin:12px 0}.primary{width:100%;border:0;background:#102e50;color:#fff;padding:15px;border-radius:9px;font-weight:700}.mobileOnly{display:none}.hide{display:none!important}
@media(max-width:700px){header{height:62px;padding:0 16px}.logo{font-size:20px}.toplinks{display:none}main{padding:0;max-width:none}.tabs{border-radius:0;margin:0;border-left:0;border-right:0}.tabs button{padding:13px 3px;font-size:12px}.workspace{display:block;height:calc(100dvh - 174px)}.panel,.map{height:100%;border:0;border-radius:0}.panelhead{padding:18px 17px 12px}.panelhead h2{font-size:22px}.cards{padding:0 14px 22px}.mapnote{top:16px}.mobileOnly{display:block}.mapcta{position:absolute;bottom:22px;left:16px;right:16px;width:calc(100% - 32px);background:#fff;border:1px solid #d3dfeb;border-radius:13px;padding:18px;text-align:left;font-size:17px;font-weight:800;box-shadow:0 5px 18px #24405b24}.detail{padding:17px}.detail h1{font-size:25px}}
</style></head><body><header><div class="logo"><span class="mark">Rc</span>Rent Check</div><nav class="toplinks"><span>홈</span><span>실거래</span><span>계산 도구</span><span>공고</span><span>분석 글</span></nav><span>⌕</span></header><main><nav class="tabs" id="tabs"></nav><div class="workspace"><section class="panel" id="panel"><div class="panelhead"><h2 id="heading">재개발 현장</h2><div class="muted" id="subtitle"></div><div class="filters"><button id="region">서울 › 강서구 ▾</button><button id="filter">진행 단계 ▾</button></div></div><div class="cards" id="cards"></div></section><section class="map" id="map"><div class="mapbg"></div><div class="mapnote" id="mapnote">서울 · 강서구</div><button class="pin" style="top:32%;left:27%" data-site="0">화곡 957-1</button><button class="pin" style="top:54%;left:60%" data-site="1">등촌 2-1</button><button class="pin" style="top:20%;left:67%" data-site="2">방화5</button><button class="mapcta mobileOnly" id="showList">현장 목록 보기　→</button></section><section class="detail hide" id="detail"><button class="back" id="back">← 이전 화면</button><div id="detailContent"></div></section></div></main><script>
const topics=[['housing','공공주택 공고'],['redevelopment','재개발'],['sale','분양'],['auction','경매']],examples={redevelopment:[['화곡 957-1 A1','공식 추진 단계 확인','강서구'],['등촌2동 모아타운 2-1','공식 자료 확인','강서구'],['방화5 재건축','공식 경계 확인','강서구']],housing:[['SH 신혼·신생아 매입임대','공고 상세 및 신청 일정','서울'],['LH 든든전세','공고 상세 및 공급현장','서울']],sale:[['분양 공고 목록','청약 일정 및 공급 규모','서울']],auction:[['경매 자료','확인된 공고만 표시','서울']]};
let topic='redevelopment',view='map',selected=0,previous='map';
const mobile=()=>matchMedia('(max-width:700px)').matches;
function start(t){return mobile()&&t!=='redevelopment'?'list':'map'}
function draw(){document.querySelector('#tabs').innerHTML=topics.map(([id,label])=>'<button data-topic="'+id+'" class="'+(topic===id?'active':'')+'">'+label+'</button>').join('');document.querySelector('#heading').textContent=topics.find(x=>x[0]===topic)[1];document.querySelector('#subtitle').textContent='공식 자료와 지도 위치를 구분하여 표시합니다';document.querySelector('#cards').innerHTML=examples[topic].map((r,i)=>'<button class="card" data-site="'+i+'"><span class="photo">⌂</span><span><strong>'+r[0]+'</strong><span class="tag">'+r[1]+'</span><div class="muted" style="margin-top:8px">'+r[2]+' · 상세 보기 →</div></span></button>').join('');document.querySelector('#mapnote').textContent='서울 · 강서구 · 지도 시안';document.querySelector('#showList').textContent=topic==='redevelopment'?'재개발 현장 목록 보기　→':'공고 목록 보기　→';document.querySelector('#panel').classList.toggle('hide',mobile()&&view!=='list');document.querySelector('#map').classList.toggle('hide',mobile()&&view!=='map');document.querySelector('#detail').classList.toggle('hide',view!=='detail');if(view==='detail'){let x=examples[topic][selected]||examples[topic][0];document.querySelector('#detailContent').innerHTML='<div class="muted">공식자료 · 상세 화면 시안</div><h1>'+x[0]+'</h1><p>'+x[2]+'</p><span class="tag">'+x[1]+'</span><div class="timeline"><div class="step done">자료 확인</div><div class="step done">진행 현황</div><div class="step">다음 단계</div></div><div class="section"><strong>최근 달라진 점</strong><p class="muted">실제 연동 시 확인된 공식 변경 이력만 표시합니다.</p></div><div class="section"><strong>사업 개요와 공식 자료</strong><p class="muted">확인된 수치와 공식 출처를 연결합니다.</p></div><button class="primary" id="detailMap">지도에서 위치 보기</button>';} }
function nav(v,sel){previous=view;if(typeof sel==='number')selected=sel;view=v;history.pushState({topic,view,selected,previous},'', '#preview/'+topic+'/'+view+(v==='detail'?'/'+selected:''));draw()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-topic]');if(t){topic=t.dataset.topic;view=start(topic);history.pushState({topic,view,selected:0,previous:'map'},'','#preview/'+topic+'/'+view);draw();return}const site=e.target.closest('[data-site]');if(site){nav('detail',Number(site.dataset.site));return}if(e.target.closest('#showList')){nav('list');return}if(e.target.closest('#back')){history.back();return}if(e.target.closest('#detailMap')){nav('map');return}if(e.target.closest('#region,#filter')){alert('이 시안은 화면 구조 검토용입니다. 실제 지역·필터 데이터 연결은 기존 프리뷰에서 유지됩니다.')}});
window.addEventListener('popstate',e=>{if(e.state){({topic,view,selected,previous}=e.state);draw()}else{view=start(topic);draw()}});
window.addEventListener('resize',()=>{if(!mobile()&&view!=='detail')view='map';draw()});
draw();
</script></body></html>
